name: Release

# Manual release after Checks passes. Pick a bump and the workflow bumps the version,
# builds a signed APK, commits the bump to main, tags it and publishes the
# release with klang.apk attached.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - current

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Free for this public repo. Blacksmith spending alerts do not cap charges.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require passing Checks for main
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Run Release from main.');
              return;
            }
            const { data: main } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'main',
            });
            if (main.commit.sha !== context.sha) {
              core.setFailed('main has advanced. Wait for its Checks to pass, then run Release again.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'checks.yml',
              head_sha: context.sha,
              per_page: 100,
            });
            const check = runs.find(run => run.head_sha === context.sha && (
              (run.event === 'push' && run.head_branch === 'main') ||
              run.event === 'workflow_dispatch'
            ));
            if (!check || check.status !== 'completed' || check.conclusion !== 'success') {
              core.setFailed(`Checks must pass for main at ${context.sha} before releasing. ` +
                'Wait for CI, or run Checks manually for this commit, then retry Release.');
              return;
            }
            core.info(`Using passing Checks for ${context.sha}: ${check.html_url}`);

      - uses: actions/checkout@v4
        with:
          # Build the main commit whose Checks result was verified above.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.KLANG_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KLANG_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KLANG_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing KLANG_KEYSTORE_B64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing KLANG_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing KLANG_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing."
            exit 1
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE: ${{ secrets.KLANG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"
          echo "KLANG_KEYSTORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'

      - name: Confirm SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bump version
        id: version
        run: |
          python3 scripts/bump-version.py "${{ inputs.bump }}" | tee "$RUNNER_TEMP/bump.txt"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/bump.txt")
          code=$(sed -n 's/^code=//p' "$RUNNER_TEMP/bump.txt")
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists. Choose a bump, not 'current'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KLANG_REQUIRE_RELEASE_SIGNING: 'true'
          KLANG_KEYSTORE_PASSWORD: ${{ secrets.KLANG_KEYSTORE_PASSWORD }}
          KLANG_KEY_ALIAS: ${{ secrets.KLANG_KEY_ALIAS }}
          KLANG_KEY_PASSWORD: ${{ secrets.KLANG_KEY_PASSWORD }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK and rename
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify-apk.py "$APK"
          python3 scripts/verify-import-packaging.py "$APK"

          built=$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" |
            sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          if [ "$built" != "$VERSION" ]; then
            echo "::error::APK reports version $built but the bump produced $VERSION."
            exit 1
          fi

          cp "$APK" klang.apk
          sha256sum klang.apk > klang.apk.sha256

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo "::error::main changed during the build. Wait for Checks and run Release again."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Nothing to commit: releasing the version already on main."
          else
            git commit -m "Release v$VERSION"
            git push origin HEAD:main
          fi
          git tag -a "v$VERSION" -m "Klang $VERSION"
          git push origin "v$VERSION"

      - name: Run Checks for the release commit
        # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch using the
        # immutable tag so Checks tests this commit even if main advances.
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'checks.yml',
              ref: process.env.RELEASE_TAG,
            });

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Klang ${{ steps.version.outputs.version }}
          files: |
            klang.apk
            klang.apk.sha256
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Klang ${{ steps.version.outputs.version }} for Android 16 and newer.

            Download `klang.apk` and open it on your phone. To check the download:

            ```
            sha256sum -c klang.apk.sha256
            ```

            Android will warn that Play Protect has not seen this app. That is expected
            for installs from outside Google Play: tap **More details → Install anyway**.
