name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease lintDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: klang-0.4.2-apk
          path: app/build/outputs/apk/release/app-release.apk
