name: Checks

on:
  # GitHub's repository approval policy gates runs from all outside contributors.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Replace outdated PR runs, but let every commit to main finish its checks.
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    # Free for this public repo. Blacksmith spending alerts do not cap charges.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check import packaging
        run: python3 scripts/test-import-packaging.py
      - name: Build, lint and test
        # A deliberately unconfigured build must work; JVM tests use a local mock endpoint.
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon
      - name: Verify APK packaging
        run: |
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-import-packaging.py app/build/outputs/apk/debug/app-debug.apk
