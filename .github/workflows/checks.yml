name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check import packaging
        run: python3 scripts/test-import-packaging.py
      - name: Check download reporting
        run: python3 scripts/test-download-report.py
      - name: Build, lint and test
        # A deliberately unconfigured build must work; JVM tests use a local mock endpoint.
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon
      - name: Verify APK packaging
        run: |
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-import-packaging.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
